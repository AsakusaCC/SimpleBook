# Project-wide Gradle settings.

# 单一版本来源：androidApp versionName 与显示页（shared/commonMain 生成的 AppVersion）
# 都从这里读，避免 KMP 迁移后版本号再次脱节（Bug：关于页恒显 "0.8"）。
simplebook.versionName=0.8.9

# AndroidX
android.useAndroidX=true

# Non-transitive R classes
android.nonTransitiveRClass=true

# JVM args
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style
kotlin.code.style=official

# AndroidX migration
android.enableJetifier=false

# Suppress unsupported compileSdk warning for AGP 8.8 with SDK 36
android.suppressUnsupportedCompileSdk=36

# Use JDK 17 for Gradle (system default is JDK 25 which is not supported by Gradle 8.x)
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home

# Allow DMG packaging with Homebrew JDK (CMP's checkJdkVendor refuses Homebrew by default)
compose.desktop.packaging.checkJdkVendor=false
